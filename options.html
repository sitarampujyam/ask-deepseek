<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask LLM options</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div id="ambient" aria-hidden="true"></div>
  <main>
    <header class="head">
      <svg class="logo" viewBox="13 13 102 102" width="52" height="52" aria-hidden="true">
        <defs>
          <path id="lb" d="M38 16H90C103.300 16 112 24.700 112 38V74C112 87.300 103.300 96 90 96H52L32.500 111.200C29.900 113.200 26.200 111.300 26.300 108L26.700 95.500C20 91.800 16 84.500 16 74V38C16 24.700 24.700 16 38 16Z"/>
          <clipPath id="lc"><use href="#lb"/></clipPath>
          <linearGradient id="lg" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient>
          <linearGradient id="ls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="lr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
        </defs>
        <use href="#lb" fill="url(#lg)"/>
        <g clip-path="url(#lc)"><rect x="10" y="10" width="108" height="40" rx="20" fill="url(#ls)"/></g>
        <use href="#lb" fill="none" stroke="url(#lr)" stroke-width="2"/>
      </svg>
      <div>
        <h1>Ask LLM</h1>
        <p class="sub">Settings are saved as you change them.</p>
      </div>
    </header>

    <section class="card glass" aria-labelledby="hReader">
      <h2 id="hReader">PDF reader</h2>
      <label class="row">
        <span class="txt">
          <span class="ttl">Open PDF links in the reader</span>
          <span class="desc">When off, PDFs open in Chrome's built-in viewer. Right-click a link, "Open in Ask LLM reader", still works.</span>
        </span>
        <input type="checkbox" role="switch" id="intercept">
      </label>
      <div class="sep"></div>
      <label class="row">
        <span class="txt">
          <span class="ttl">Remember where I stopped</span>
          <span class="desc">Reopening a PDF returns to the same page, zoom and rotation. Stored only in this browser.</span>
        </span>
        <input type="checkbox" role="switch" id="remember">
      </label>
      <div class="row action">
        <span class="txt">
          <span class="ttl">Saved positions</span>
          <span class="desc" id="forgot">Clear every remembered page and zoom.</span>
        </span>
        <button id="forget" class="pill">Forget all</button>
      </div>
    </section>


    <p class="foot">Nothing is sent anywhere until you press send in the chat. No analytics, no tracking.</p>
  </main>
  <div id="saved" class="glass" role="status">Saved</div>
  <script src="options.js"></script>
</body>
</html>
