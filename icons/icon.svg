<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- bubble outline: soft rounded body with a tail at the bottom left -->
    <path id="b" d="M64 14C95 14 116 32 116 56C116 80 95 98 64 98C58 98 52 97.300 46.500 96L27 108.500C24.800 109.900 22.200 107.700 23.200 105.300L29.300 90.500C18.600 82.600 12 70.300 12 56C12 32 33 14 64 14Z"/>
    <clipPath id="clip"><use href="#b"/></clipPath>
    <!-- glass body: bright core, deeper colour toward the rim (thicker glass) -->
    <radialGradient id="body" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#e9f1ff" stop-opacity=".92"/>
      <stop offset=".38" stop-color="#9fbcff" stop-opacity=".88"/>
      <stop offset=".72" stop-color="#6f7dff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#5a3fe0" stop-opacity=".98"/>
    </radialGradient>
    <!-- light passing through and pooling at the bottom right (caustic) -->
    <radialGradient id="caustic" cx="72%" cy="88%" r="45%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#c9b8ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#c9b8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="dot" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="shadow" x="-40%" y="-300%" width="180%" height="700%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="dotShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.200" stdDeviation="1.100" flood-color="#3a1fb0" flood-opacity=".45"/></filter>
  </defs>

  <!-- shadow on the surface below, so it lifts off the screen -->
  <ellipse cx="66" cy="115" rx="38" ry="5.500" fill="#2a1a80" opacity=".30" filter="url(#shadow)"/>

  <use href="#b" fill="url(#body)"/>
  <g clip-path="url(#clip)">
    <!-- inner edge darkening = glass thickness -->
    <use href="#b" fill="none" stroke="#3b22b8" stroke-opacity=".55" stroke-width="10" filter="url(#soft)"/>
    <ellipse cx="80" cy="92" rx="44" ry="24" fill="url(#caustic)"/>
    <path d="M30 80C42 92 86 94 104 74" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" filter="url(#soft2)"/>
    <!-- big soft gloss across the top -->
    <ellipse cx="56" cy="30" rx="40" ry="17" fill="url(#gloss)" opacity=".85" filter="url(#soft2)"/>
    <!-- sharp specular highlight -->
    <ellipse cx="38" cy="30" rx="11" ry="5.500" transform="rotate(-24 38 30)" fill="#fff" opacity=".95"/>
    <circle cx="54" cy="22.500" r="2.400" fill="#fff" opacity=".9"/>
  </g>
  <!-- rim light -->
  <use href="#b" fill="none" stroke="url(#rim)" stroke-width="1.800"/>

  <!-- three dots: frosted beads sitting in the glass -->
  <g filter="url(#dotShadow)">
    <circle cx="42" cy="58" r="7.500" fill="url(#dot)"/>
    <circle cx="64" cy="58" r="7.500" fill="url(#dot)"/>
    <circle cx="86" cy="58" r="7.500" fill="url(#dot)"/>
  </g>
</svg>
