<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask DeepSeek</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="strip" class="strip" role="toolbar" aria-label="Ask DeepSeek tools">
    <div id="providerSeg" class="pseg" role="radiogroup" aria-label="Chat service">
      <button role="radio" data-p="deepseek" aria-checked="true">DeepSeek</button>
      <button role="radio" data-p="claude" aria-checked="false">Claude</button>
    </div>
    <button id="btnSnap" class="chip" aria-label="Snapshot" title="Add a snapshot of the current tab to the chat">
      <svg viewBox="0 0 24 24"><path d="M4 8.500a2 2 0 0 1 2-2h1.500l1.200-2h6.600l1.200 2H18a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.800" r="3.500"/></svg><span class="lbl">Snapshot</span>
    </button>
    <button id="btnSummarise" class="chip" aria-label="Summarise" title="Paste this page's text plus a snapshot and ask to summarise it">
      <svg viewBox="0 0 24 24"><path d="M4 6.500h16M4 12h16M4 17.500h9"/><path d="M18.500 14.500l.9 2.100 2.100.9-2.100.9-.9 2.100-.9-2.100-2.100-.9 2.100-.9z" fill="currentColor" stroke="none"/></svg><span class="lbl">Summarise</span>
    </button>
    <span id="stripHint" class="hint"></span>
  </div>
  <iframe id="frame" title="Chat" allow="clipboard-write; clipboard-read"></iframe>

  <div id="notice" class="notice" hidden role="status">
    <p id="noticeText"></p>
    <div class="row" id="noticeButtons"></div>
  </div>
  <div id="toast" class="toast" hidden role="status"></div>

  <script src="providers.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
