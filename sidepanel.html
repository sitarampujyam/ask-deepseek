<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask LLM</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <div id="strip" class="bar glass" role="toolbar" aria-label="Chat tools">
      <button id="pickBtn" class="pick" aria-haspopup="menu" aria-expanded="false" title="Choose which chat to use">
        <span class="pdot" aria-hidden="true"></span><span id="pickName">DeepSeek</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
      </button>
      <span class="grow"></span>
      <button id="btnSnap" class="ibtn" aria-label="Snapshot" title="Add a snapshot of the current tab to the chat">
        <svg viewBox="0 0 24 24"><path d="M4 8.500a2 2 0 0 1 2-2h1.500l1.200-2h6.600l1.200 2H18a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.800" r="3.500"/></svg>
      </button>
      <button id="btnSummarise" class="ibtn" aria-label="Summarise" title="Paste this page's text plus a snapshot and ask to summarise it">
        <svg viewBox="0 0 24 24"><path d="M4 6.500h16M4 12h16M4 17.500h9"/><path d="M18.500 14.500l.9 2.100 2.100.9-2.100.9-.9 2.100-.9-2.100-2.100-.9 2.100-.9z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btnReload" class="ibtn" aria-label="Reload chat" title="Reload the chat (fixes a stuck sign-in or bot check)">
        <svg viewBox="0 0 24 24"><path d="M19.500 12a7.500 7.500 0 1 1-2.200-5.300"/><path d="M19.500 4.500v4h-4"/></svg>
      </button>
    </div>
    <div id="pickMenu" class="menu glass" role="menu" aria-label="Chat" hidden></div>
    <div id="stripHint" class="hint"></div>
  </header>
  <iframe id="frame" title="Chat" allow="clipboard-write; clipboard-read"></iframe>

  <div id="notice" class="notice glass" hidden role="status">
    <p id="noticeText"></p>
    <div class="row" id="noticeButtons"></div>
  </div>
  <div id="toast" class="toast glass" hidden role="status"></div>

  <script src="providers.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
