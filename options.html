<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask LLM options</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div id="ambient" aria-hidden="true"></div>
  <main>
    <header class="head">
      <img src="icons/icon128.png" alt="" width="52" height="52">
      <div>
        <h1>Ask LLM</h1>
        <p class="sub">Settings are saved as you change them.</p>
      </div>
    </header>

    <section class="card glass" aria-labelledby="hReader">
      <h2 id="hReader">PDF reader</h2>
      <label class="row">
        <span class="txt">
          <span class="ttl">Open PDF links in the reader</span>
          <span class="desc">When off, PDFs open in Chrome's built-in viewer. Right-click a link, "Open in Ask LLM reader", still works.</span>
        </span>
        <input type="checkbox" role="switch" id="intercept">
      </label>
      <div class="sep"></div>
      <label class="row">
        <span class="txt">
          <span class="ttl">Remember where I stopped</span>
          <span class="desc">Reopening a PDF returns to the same page, zoom and rotation. Stored only in this browser.</span>
        </span>
        <input type="checkbox" role="switch" id="remember">
      </label>
      <div class="row action">
        <span class="txt">
          <span class="ttl">Saved positions</span>
          <span class="desc" id="forgot">Clear every remembered page and zoom.</span>
        </span>
        <button id="forget" class="pill">Forget all</button>
      </div>
    </section>


    <p class="foot">Nothing is sent anywhere until you press send in the chat. No analytics, no tracking.</p>
  </main>
  <div id="saved" class="glass" role="status">Saved</div>
  <script src="options.js"></script>
</body>
</html>
