<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF reader</title>
  <link rel="stylesheet" href="lib/textlayer.css">
  <link rel="stylesheet" href="lib/annotation.css">
  <link rel="stylesheet" href="lib/editor.css">
  <link rel="stylesheet" href="viewer.css">
  <script src="theme-init.js"></script>
</head>
<body data-mode="normal">
  <div id="ambient" aria-hidden="true"></div>

  <main id="container" tabindex="-1" aria-label="Document">
    <div id="pages"></div>
    <div id="message" class="glass" hidden></div>
  </main>

  <nav id="sidebar" class="glass" aria-label="Page thumbnails">
    <div id="thumbs"></div>
  </nav>

  <header id="toolbar" class="glass" role="toolbar" aria-label="PDF toolbar">
    <div id="progress" hidden aria-hidden="true"><i></i></div>
    <button class="btn" id="btnSidebar" aria-label="Toggle page thumbnails" title="Pages">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M9.5 4v16"/></svg>
    </button>
    <div id="title" title="">Loading…</div>

    <div class="group" role="group" aria-label="Page">
      <input id="pageInput" class="field" type="text" inputmode="numeric" value="1" aria-label="Page number" size="3">
      <span id="pageCount" class="dim">/ –</span>
    </div>

    <span class="sep"></span>

    <div class="group" role="group" aria-label="Zoom">
      <button class="btn" id="zoomOut" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5.5 12h13"/></svg></button>
      <input id="zoomInput" class="field wide" type="text" value="100%" aria-label="Zoom level" size="5">
      <button class="btn" id="zoomIn" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
    </div>

    <button class="btn" id="btnFit" aria-label="Fit to page" title="Fit to page">
      <svg id="icoFitPage" viewBox="0 0 24 24"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></svg>
      <svg id="icoFitWidth" viewBox="0 0 24 24" hidden><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>
    </button>
    <button class="btn" id="btnRotate" aria-label="Rotate counterclockwise" title="Rotate counterclockwise">
      <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.7-6.2L3.5 8.5"/><path d="M3.5 3.5v5h5"/></svg>
    </button>

    <span class="sep"></span>

    <button class="btn" id="btnMode" aria-label="Page colour: Original" title="Page colour: Original (click to cycle)">
      <svg class="mode-ico" data-for="normal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
      <svg class="mode-ico" data-for="dark" viewBox="0 0 24 24" hidden><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
      <svg class="mode-ico" data-for="sepia" viewBox="0 0 24 24" hidden><path d="M2.5 5.8C5 4.3 8.6 4.4 12 6.3c3.4-1.9 7-2 9.5-.5v13.2c-2.5-1.5-6.100-1.400-9.500.5-3.400-1.900-7-2-9.500-.5z"/><path d="M12 6.300v13"/></svg>
    </button>
    <button class="btn" id="btnAnnotate" aria-label="Annotate" title="Annotate: highlight, draw, add text" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M4 20h4.2L19.4 8.800a2.100 2.100 0 0 0 0-3L18.200 4.600a2.100 2.100 0 0 0-3 0L4 15.800z"/><path d="M13.400 6.400l4.200 4.200"/></svg>
      <i class="dot" aria-hidden="true"></i>
    </button>
    <button class="btn" id="btnSnap" aria-label="Add a snapshot of this view to DeepSeek" title="Add snapshot of this view to DeepSeek">
      <svg viewBox="0 0 24 24"><path d="M4 8.500a2 2 0 0 1 2-2h1.500l1.200-2h6.600l1.200 2H18a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.800" r="3.500"/></svg>
    </button>
    <button class="btn" id="btnDownload" aria-label="Download" title="Download" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M12 3.5v11M7.500 10l4.500 4.500L16.500 10M4.500 19.500h15"/></svg>
      <i class="dot" aria-hidden="true"></i>
    </button>
    <button class="btn" id="btnPrint" aria-label="Print" title="Print">
      <svg viewBox="0 0 24 24"><path d="M7 8.500V3.500h10v5M7 17H5.500a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H17"/><rect x="7" y="13.500" width="10" height="7" rx="1.500"/></svg>
    </button>
    <button class="btn" id="btnMore" aria-label="More actions" title="More actions" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" class="fill"><circle cx="12" cy="5.500" r="1.700"/><circle cx="12" cy="12" r="1.700"/><circle cx="12" cy="18.500" r="1.700"/></svg>
    </button>
  </header>

  <div id="annotWrap" hidden>
    <div id="annot" class="glass" role="toolbar" aria-label="Annotation tools">
      <div class="tools" id="tools" role="radiogroup" aria-label="Tool">
        <button class="tool" data-tool="select" role="radio" aria-checked="false" title="Select: move, resize or delete marks you already made">
          <svg viewBox="0 0 24 24"><path d="M6 4l12.500 6-5.400 1.900L11 17.500z"/></svg><span>Select</span></button>
        <button class="tool" data-tool="highlight" role="radio" aria-checked="false" title="Highlight: select text, or drag over empty space to use a highlighter pen">
          <svg viewBox="0 0 24 24"><path d="M9 14.500l5.500-5.500 3 3L12 17.500H8z"/><path d="M14.500 9l1.800-1.800a1.500 1.500 0 0 1 2.100 0l.9.900a1.500 1.500 0 0 1 0 2.100L17.500 12"/><path d="M5 20.500h14"/></svg><span>Highlight</span></button>
        <button class="tool" data-tool="ink" role="radio" aria-checked="false" title="Draw">
          <svg viewBox="0 0 24 24"><path d="M3.500 17.500c2.500-5.500 4.500-9 6-9s.5 5 2.500 5 3-4.500 5-4.500 2.500 3.500 3.500 3.500"/><path d="M3.500 20.500h17"/></svg><span>Draw</span></button>
        <button class="tool" data-tool="text" role="radio" aria-checked="false" title="Add text">
          <svg viewBox="0 0 24 24"><path d="M5 6.500V5h14v1.500M12 5v14M9 19h6"/></svg><span>Text</span></button>
      </div>
      <span class="sep" id="sepColors"></span>
      <div id="swatches" role="radiogroup" aria-label="Colour"></div>
      <label id="sizeBox" class="size"><span id="sizeLabel">Thickness</span><input id="sizeRange" type="range" min="1" max="20" step="1" value="3"><output id="sizeOut">3</output></label>
      <span class="sep"></span>
      <button class="btn" id="aUndo" aria-label="Undo" title="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4.500 9.500 9 5"/><path d="M4.500 9.500H15a4.500 4.500 0 0 1 0 9h-3"/></svg></button>
      <button class="btn" id="aRedo" aria-label="Redo" title="Redo" disabled><svg viewBox="0 0 24 24"><path d="M15 14l4.500-4.500L15 5"/><path d="M19.500 9.500H9a4.500 4.500 0 0 0 0 9h3"/></svg></button>
      <span class="sep"></span>
      <button class="pill primary compact" id="aSave" title="Save a copy of the PDF with your changes">Save</button>
      <button class="btn" id="aDone" aria-label="Close annotation tools" title="Done"><svg viewBox="0 0 24 24"><path d="M6.500 6.500l11 11M17.500 6.500l-11 11"/></svg></button>
    </div>
  </div>

  <div id="dlMenu" class="glass" role="menu" hidden>
    <button class="item" role="menuitem" id="dlEdited"><span class="chk"></span>With your changes</button>
    <button class="item" role="menuitem" id="dlOriginal"><span class="chk"></span>Without your changes</button>
  </div>

  <div id="menu" class="glass" role="menu" hidden>
    <button class="item" role="menuitemcheckbox" id="miTwoPage" aria-checked="false">
      <span class="chk"><svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></span>Two page view
    </button>
    <button class="item" role="menuitemcheckbox" id="miAnnots" aria-checked="true">
      <span class="chk"><svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></span>Annotations
    </button>
    <div class="hr"></div>
    <div class="theme">
      <div class="theme-label" id="themeLabel">Theme</div>
      <div class="seg" id="seg" role="radiogroup" aria-labelledby="themeLabel">
        <button role="radio" data-theme="light" aria-checked="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.500v2M12 19.500v2M4.600 4.600L6 6M18 18l1.400 1.400M2.500 12h2M19.500 12h2M4.600 19.400L6 18M18 6l1.400-1.400"/></svg>Light</button>
        <button role="radio" data-theme="dark" aria-checked="false"><svg viewBox="0 0 24 24"><path d="M20 14.200A8 8 0 0 1 9.800 4 8 8 0 1 0 20 14.200z"/></svg>Dark</button>
        <button role="radio" data-theme="system" aria-checked="true"><svg viewBox="0 0 24 24"><rect x="3" y="4.500" width="18" height="12" rx="2.500"/><path d="M9 20h6M12 16.500V20"/></svg>System</button>
      </div>
    </div>
    <div class="hr"></div>
    <div class="theme">
      <div class="theme-label" id="accentLabel">Colour</div>
      <div class="hues" id="hues" role="radiogroup" aria-labelledby="accentLabel"></div>
    </div>
    <div class="hr"></div>
    <button class="item" role="menuitem" id="miPresent"><span class="chk"></span>Present</button>
    <button class="item" role="menuitem" id="miProps"><span class="chk"></span>Document properties</button>
    <div class="hr"></div>
    <button class="item" role="menuitem" id="miNative"><span class="chk"></span>Open in Chrome’s viewer</button>
  </div>

  <div id="props" class="overlay" hidden>
    <div class="card glass" role="dialog" aria-modal="true" aria-labelledby="propsTitle">
      <h2 id="propsTitle">Document properties</h2>
      <dl id="propsList"></dl>
      <button class="pill" id="propsClose">Close</button>
    </div>
  </div>

  <div id="pwd" class="overlay" hidden>
    <form class="card glass" id="pwdForm" role="dialog" aria-modal="true" aria-labelledby="pwdTitle">
      <h2 id="pwdTitle">Password required</h2>
      <p id="pwdMsg" class="pwd-msg"></p>
      <input id="pwdInput" class="field pwd-field" type="password" autocomplete="off" aria-label="PDF password">
      <div class="pwd-row"><button type="button" class="pill" id="pwdCancel">Cancel</button><button type="submit" class="pill primary">Open</button></div>
    </form>
  </div>

  <div id="toast" class="glass" role="status" aria-live="polite"></div>
  <div id="printContainer" aria-hidden="true"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="glass-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <script type="module" src="viewer.js"></script>
  <script src="providers.js"></script>
  <script src="page-button.js"></script>
</body>
</html>
